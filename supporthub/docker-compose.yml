services:
  db:
    image: pgvector/pgvector:pg16
    container_name: supporthub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: supporthub
      POSTGRES_PASSWORD: supporthub_dev
      POSTGRES_DB: supporthub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supporthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supporthub_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
