name: Frontend CI

on:
  push:
    paths: ['supporthub/frontend/**']
  pull_request:
    paths: ['supporthub/frontend/**']

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: supporthub/frontend/package-lock.json

      - name: Install
        working-directory: supporthub/frontend
        run: npm ci

      - name: Type check
        working-directory: supporthub/frontend
        run: npm run build 2>&1 | grep -E "error|warning" || true

      - name: Build
        working-directory: supporthub/frontend
        run: npm run build
