[project]
name = "supporthub-backend"
version = "0.1.0"
description = "SupportHub AI Omnichannel Customer Support — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlmodel>=0.0.21",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    # Auth
    "fastapi-users[sqlalchemy]>=13.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyotp>=2.9.0",
    # AI
    "anthropic>=0.34.0",
    # Background tasks
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    # HTTP client (channel integrations)
    "httpx>=0.27.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Config
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    # Email
    "postmarker>=1.0.0",
    # File storage
    "supabase>=2.7.0",
    # Exports
    "weasyprint>=62.0",
    # Monitoring
    "sentry-sdk[fastapi]>=2.14.0",
    "google-generativeai>=0.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
